<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loomis Face Studio - تحليل الصور</title>
    <!-- MediaPipe Face Mesh Library -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }
        header {
            width: 100%;
            background: #1f1f1f;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #d4af37;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .container {
            position: relative;
            margin-top: 20px;
            width: 360px;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #1e1e1e;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .controls {
            margin-top: 20px;
            width: 90%;
            max-width: 360px;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label.file-btn {
            background: #d4af37;
            color: #121212;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            display: block;
        }
        label.file-btn:active { background: #b08d26; }
        input[type="file"] { display: none; }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        input[type="range"] { width: 100%; accent-color: #d4af37; }
        .status {
            text-align: center;
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <header>Loomis Face Studio - تحليل تقنية لوميس</header>

    <div class="container">
        <canvas id="output_canvas" width="360" height="480"></canvas>
    </div>

    <div class="controls">
        <label class="file-btn" for="imageUpload">رفع صورة وجه من الألبوم</label>
        <input type="file" id="imageUpload" accept="image/*">
        
        <div class="control-group">
            <span>شفافية شبكة لوميس: <span id="opacityVal">80</span>%</span>
            <input type="range" id="opacityRange" min="0" max="100" value="80">
        </div>
        <div class="status" id="statusText">قم برفع صورة وجه لبدء التخطيط الهندسي</div>
    </div>

    <script>
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const opacityRange = document.getElementById('opacityRange');
        const opacityVal = document.getElementById('opacityVal');
        const statusText = document.getElementById('statusText');
        const imageUpload = document.getElementById('imageUpload');

        let loomisOpacity = 0.8;
        let currentImage = null;
        let currentLandmarks = null;

        opacityRange.addEventListener('input', (e) => {
            loomisOpacity = e.target.value / 100;
            opacityVal.textContent = e.target.value;
            if (currentImage) {
                redraw();
            }
        });

        // تهيئة MediaPipe Face Mesh لتحليل معالم الوجه
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults((results) => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                currentLandmarks = results.multiFaceLandmarks[0];
                statusText.textContent = "تم تحليل الوجه وتخطيط شبكة لوميس بنجاح!";
            } else {
                currentLandmarks = null;
                statusText.textContent = "لم يتم اكتشاف وجه بوضوح، يرجى رفع صورة أخرى.";
            }
            redraw();
        });

        // التعامل مع رفع الصورة
        imageUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusText.textContent = "جاري تحليل الصورة ومعالجة الأبعاد...";
            const img = new Image();
            img.onload = async () => {
                currentImage = img;
                
                // ضبط أبعاد اللوحة برمجياً لتناسب الصورة
                canvasElement.width = img.width;
                canvasElement.height = img.height;

                redraw();
                await faceMesh.send({image: img});
            };
            img.src = URL.createObjectURL(file);
        });

        function redraw() {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            if (currentImage) {
                canvasCtx.drawImage(currentImage, 0, 0, canvasElement.width, canvasElement.height);
            } else {
                canvasCtx.fillStyle = "#1e1e1e";
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.fillStyle = "#777";
                canvasCtx.font = "16px Tahoma";
                canvasCtx.textAlign = "center";
                canvasCtx.fillText("اختر صورة وجه لبدء التدريب", canvasElement.width / 2, canvasElement.height / 2);
            }

            if (currentLandmarks) {
                drawLoomisWireframe(currentLandmarks, canvasElement.width, canvasElement.height);
            }
        }

        // خوارزمية رسم تقنية لوميس الهندسية
        function drawLoomisWireframe(landmarks, width, height) {
            canvasCtx.save();
            canvasCtx.globalAlpha = loomisOpacity;

            const topHead = landmarks[10];     // قمة الرأس
            const chin = landmarks[152];       // الذقن
            const leftCheek = landmarks[234];  // عظمة الخد اليمنى
            const rightCheek = landmarks[454]; // عظمة الخد اليسرى
            const brow = landmarks[9];         // منتصف الحاجبين
            const noseBase = landmarks[2];     // قاعدة الأنف

            const cx = (topHead.x * width + chin.x * width) / 2;
            const headTopY = topHead.y * height;
            const chinY = chin.y * height;
            const faceHeight = chinY - headTopY;
            const faceWidth = Math.abs(rightCheek.x - leftCheek.x) * width;

            // 1. الكرة الأساسية لتقنية لوميس (The Sphere)
            const sphereRadius = faceWidth * 0.55;
            const sphereCenterY = headTopY + faceHeight * 0.45;
            
            canvasCtx.strokeStyle = '#d4af37'; // لون ذهبي
            canvasCtx.lineWidth = Math.max(2, width * 0.003);
            canvasCtx.beginPath();
            canvasCtx.arc(cx, sphereCenterY, sphereRadius, 0, 2 * Math.PI);
            canvasCtx.stroke();

            // 2. الجوانب المقصوصة للكرة (Side Planes)
            canvasCtx.strokeStyle = '#3498db'; // لون أزرق للتقطيع الجانبي
            canvasCtx.setLineDash([6, 6]);
            canvasCtx.beginPath();
            canvasCtx.ellipse(cx, sphereCenterY, sphereRadius * 0.35, sphereRadius * 0.7, 0, 0, 2 * Math.PI);
            canvasCtx.stroke();
            canvasCtx.setLineDash([]);

            // 3. خطوط التقسيم الأربعة للنسب
            const hairlineY = headTopY + faceHeight * 0.2;
            drawHorizontalLine(hairlineY, width, 'خط الشعر');

            const browY = brow.y * height;
            drawHorizontalLine(browY, width, 'خط الحواجب');

            const noseY = noseBase.y * height;
            drawHorizontalLine(noseY, width, 'خط الأنف');

            drawHorizontalLine(chinY, width, 'خط الذقن');

            // خط المنتصف العمودي
            canvasCtx.strokeStyle = '#e74c3c'; // لون أحمر لخط المنتصف
            canvasCtx.beginPath();
            canvasCtx.moveTo(cx, headTopY);
            canvasCtx.lineTo(cx, chinY);
            canvasCtx.stroke();

            canvasCtx.restore();
        }

        function drawHorizontalLine(y, width, label) {
            canvasCtx.strokeStyle = 'rgba(212, 175, 55, 0.85)';
            canvasCtx.lineWidth = Math.max(1.5, width * 0.002);
            canvasCtx.beginPath();
            canvasCtx.moveTo(width * 0.05, y);
            canvasCtx.lineTo(width * 0.95, y);
            canvasCtx.stroke();

            canvasCtx.fillStyle = '#d4af37';
            canvasCtx.font = `${Math.max(11, width * 0.025)}px Tahoma`;
            canvasCtx.fillText(label, width * 0.07, y - 5);
        }
    </script>
</body>
</html>
